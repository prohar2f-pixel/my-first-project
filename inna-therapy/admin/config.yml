backend:
  name: github
  repo: prohar2f-pixel/my-first-project
  branch: main
  base_url: https://my-first-project-rouge-iota.vercel.app
  auth_endpoint: api/auth

media_folder: inna-therapy/images
public_folder: images

locale: ru

collections:
  - name: content
    label: Контент сайта
    files:
      - name: main
        label: Основной контент
        file: inna-therapy/content.json
        format: json
        fields:
          - label: Тексты разделов
            name: texts
            widget: object
            collapsed: true
            fields:
              - { label: "Главный экран — заголовок", name: hero_title, widget: string, hint: "Розовое слово оформляется так: <span class='accent'>слово</span>. Перенос строки — <br>" }
              - { label: "Главный экран — подзаголовок", name: hero_subtitle, widget: text, hint: "<br> — перенос строки" }
              - { label: "Главный экран — плашка (мягкий подход)", name: hero_badge, widget: text }
              - { label: "Обо мне — заголовок", name: about_h2, widget: string }
              - { label: "Обо мне — абзац 1", name: about_p1, widget: text }
              - { label: "Обо мне — абзац 2", name: about_p2, widget: text }
              - { label: "Обо мне — цитата", name: about_quote, widget: text, hint: "<br> — перенос строки" }
              - { label: "Мой подход — абзац 1", name: approach_p1, widget: text }
              - { label: "Мой подход — абзац 2", name: approach_p2, widget: text }
              - { label: "Мой подход — цитата", name: approach_quote, widget: text, hint: "<br> — перенос строки" }
              - { label: "Как проходит сеанс — заголовок", name: steps_h2, widget: string }
              - { label: "Как проходит сеанс — строка результата", name: steps_result, widget: text }
              - { label: "Отзывы — заголовок", name: reviews_h2, widget: string }
              - { label: "Цены — заголовок", name: prices_h2, widget: string }
              - { label: "Акции — заголовок раздела", name: offers_h2, widget: string }
              - { label: "Акция 1 — название", name: offer1_title, widget: string, hint: "<br> — перенос строки" }
              - { label: "Акция 1 — текст", name: offer1_text, widget: text }
              - { label: "Акция 1 — цена со скидкой", name: offer1_price, widget: string }
              - { label: "Акция 1 — старая цена", name: offer1_old, widget: string }
              - { label: "Акция 1 — примечание (условие)", name: offer1_note, widget: text }
              - { label: "Акция 2 — название", name: offer2_title, widget: string, hint: "<br> — перенос строки" }
              - { label: "Кабинеты — заголовок", name: location_h2, widget: string }
              - { label: "Кабинеты — подзаголовок", name: location_subtitle, widget: text }
              - { label: "Призыв — заголовок", name: options_h2, widget: string }
              - { label: "Призыв — подзаголовок", name: options_subtitle, widget: text }

          - label: Специальности
            name: specialties
            widget: list
            collapsed: true
            hint: "Можно менять текст пунктов. Количество (6) лучше не менять — иконки на сайте заданы по местам."
            field: { label: Специальность, name: item, widget: string }

          - label: Шаги (как проходит сеанс)
            name: steps
            widget: list
            collapsed: true
            hint: "Можно менять текст. Количество (5) лучше не менять — иконки на сайте заданы по местам."
            fields:
              - { label: Название шага, name: title, widget: string }
              - { label: Описание шага, name: desc, widget: text }

          - label: Контакты
            name: contacts
            widget: object
            fields:
              - { label: Телефон (для ссылки), name: phone, widget: string }
              - { label: Телефон (для отображения), name: phone_display, widget: string }
              - { label: Telegram (ссылка), name: telegram, widget: string }
              - { label: MAX (ссылка), name: max, widget: string }
              - { label: Ссылка предоплаты, name: prepay_link, widget: string }

          - label: Цены
            name: prices
            widget: list
            fields:
              - { label: Иконка (эмодзи), name: icon, widget: string }
              - { label: Название, name: name, widget: string }
              - { label: Описание, name: desc, widget: string }
              - { label: Стоимость, name: amount, widget: string }

          - label: Отзывы
            name: reviews
            widget: list
            fields:
              - { label: Текст отзыва, name: text, widget: text }
              - { label: Автор, name: author, widget: string }
              - { label: Подпись, name: role, widget: string, required: false, default: "Клиентка" }
              - { label: Фото клиентки, name: photo, widget: image, required: false }

          - label: Аудиоотзывы
            name: audio_reviews
            widget: list
            fields:
              - { label: Автор, name: author, widget: string }
              - { label: Подпись, name: role, widget: string, required: false, default: "Клиентка" }
              - { label: Фото клиентки, name: photo, widget: image, required: false }
              - { label: Аудиофайл, name: audio, widget: file, required: false }
              - { label: Длительность, name: duration, widget: string, required: false, hint: "Например: 1:24" }

          - label: Локации
            name: locations
            widget: list
            fields:
              - { label: Название, name: name, widget: string }
              - { label: Подпись, name: sub, widget: string }
              - { label: Адрес, name: address, widget: string }
              - { label: Фото (URL), name: photo, widget: image }
