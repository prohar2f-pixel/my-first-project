<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ — AI Генератор</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f0f13; color: #e8e8f0; min-height: 100vh; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; border-bottom: 1px solid #1e1e2e; }
  .logo { font-size: 17px; font-weight: 700; }
  .logo span { color: #7c6af7; }
  .links { display: flex; gap: 10px; }
  .btn-link { background: none; border: 1px solid #2a2a40; border-radius: 6px; padding: 5px 12px; color: #888; cursor: pointer; font-size: 12px; text-decoration: none; display: inline-block; }
  .main { max-width: 900px; margin: 32px auto; padding: 0 20px; }
  h2 { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: #aaa; }
  .card { background: #15151f; border: 1px solid #2a2a40; border-radius: 12px; padding: 24px; margin-bottom: 28px; }
  .grid-form { display: grid; grid-template-columns: 1fr 1fr 120px 100px; gap: 10px; align-items: end; }
  label { display: block; font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
  input { width: 100%; background: #0f0f13; border: 1px solid #2a2a40; border-radius: 7px; color: #e8e8f0; font-size: 13px; padding: 9px 12px; outline: none; font-family: inherit; }
  input:focus { border-color: #7c6af7; }
  .btn { background: linear-gradient(135deg, #7c6af7, #a855f7); color: #fff; border: none; border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 10px; border-bottom: 1px solid #1e1e2e; }
  td { padding: 10px; border-bottom: 1px solid #1a1a2e; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .credits-input { width: 80px; background: #0f0f13; border: 1px solid #2a2a40; border-radius: 6px; color: #e8e8f0; font-size: 13px; padding: 6px 8px; outline: none; font-family: inherit; }
  .btn-sm { background: #7c6af7; color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  .msg { font-size: 13px; color: #22c55e; margin-top: 10px; display: none; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">pixel<span>AI</span> &mdash; Админ</div>
  <div class="links">
    <a class="btn-link" href="index.html">Генератор</a>
    <button class="btn-link" onclick="logout()">Выйти</button>
  </div>
</div>
<div class="main">
  <div class="card">
    <h2>Создать клиента</h2>
    <div class="grid-form">
      <div>
        <label>Логин</label>
        <input type="text" id="new-username" placeholder="username">
      </div>
      <div>
        <label>Пароль</label>
        <input type="password" id="new-password" placeholder="пароль">
      </div>
      <div>
        <label>Кредиты</label>
        <input type="number" id="new-credits" value="50" min="0">
      </div>
      <div>
        <label>&nbsp;</label>
        <button class="btn" onclick="createUser()">Создать</button>
      </div>
    </div>
    <div class="msg" id="create-msg">Клиент создан</div>
  </div>

  <div class="card">
    <h2>Клиенты</h2>
    <table>
      <thead>
        <tr>
          <th>Логин</th>
          <th>Кредиты</th>
          <th>Дата регистрации</th>
          <th>Изменить кредиты</th>
        </tr>
      </thead>
      <tbody id="users-table"></tbody>
    </table>
  </div>
</div>
<script>
  const API = 'https://image-gen-api-production-523d.up.railway.app';
  const token = localStorage.getItem('token');
  const isAdmin = localStorage.getItem('is_admin') === 'true';
  if (!token || !isAdmin) location.href = 'login.html';

  async function loadUsers() {
    const resp = await fetch(`${API}/api/admin/users`, { headers: { 'Authorization': `Bearer ${token}` } });
    const users = await resp.json();
    document.getElementById('users-table').innerHTML = users.map(u => `
      <tr>
        <td>${u.username}</td>
        <td id="cr-${u.id}">${u.credits}</td>
        <td>${new Date(u.created_at).toLocaleDateString('ru')}</td>
        <td style="display:flex;gap:8px;align-items:center">
          <input class="credits-input" type="number" id="inp-${u.id}" value="${u.credits}" min="0">
          <button class="btn-sm" onclick="setCredits(${u.id})">Сохранить</button>
        </td>
      </tr>`).join('');
  }

  async function createUser() {
    const username = document.getElementById('new-username').value.trim();
    const password = document.getElementById('new-password').value;
    const credits = Number(document.getElementById('new-credits').value);
    if (!username || !password) return;

    const resp = await fetch(`${API}/api/admin/users`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ username, password, credits }),
    });
    if (resp.ok) {
      document.getElementById('new-username').value = '';
      document.getElementById('new-password').value = '';
      const msg = document.getElementById('create-msg');
      msg.style.display = 'block';
      setTimeout(() => msg.style.display = 'none', 3000);
      loadUsers();
    } else {
      const err = await resp.json();
      alert(err.detail);
    }
  }

  async function setCredits(userId) {
    const credits = Number(document.getElementById(`inp-${userId}`).value);
    const resp = await fetch(`${API}/api/admin/users/${userId}/credits`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ credits }),
    });
    if (resp.ok) {
      document.getElementById(`cr-${userId}`).textContent = credits;
    }
  }

  function logout() { localStorage.clear(); location.href = 'login.html'; }

  loadUsers();
</script>
</body>
</html>
